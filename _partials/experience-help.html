<!-- ============ "Our Experience Makes the Difference!" + "How can we help you?" (Figma "05 Experience & Help" 2577:615) ============
     Dark card + white card side by side (stacked on tablet/mobile) on the grey (#F4F4F4) background.
     Default has NO top padding (in Figma it follows a grey section that already has bottom padding);
     add class "help-cards--padded" when it follows a white or dark section. -->
<section class="help-cards" data-reveal="stagger" data-reveal-distance="50">
  <article class="help-card help-card--dark">
    <img class="help-card__icon" src="/assets/icons/team.svg" alt="" width="72" height="72">
    <div class="help-card__body">
      <h2 class="help-card__title">Our Experience Makes the Difference!</h2>
      <p class="help-card__text">Meet the minds that make up our unique team of specialists.</p>
      <a href="/our-team/" class="btn btn--red btn--shadow-red">Learn More</a>
    </div>
  </article>
  <article class="help-card">
    <img class="help-card__icon" src="/assets/icons/schedule.svg" alt="" width="72" height="72">
    <div class="help-card__body">
      <h2 class="help-card__title">How can we help you?</h2>
      <p class="help-card__text">Let’s schedule a call to discuss your equipment leasing and finance needs.</p>
      <a href="/contact/" class="btn btn--dark btn--semibold">Contact Us</a>
    </div>
  </article>
</section>
