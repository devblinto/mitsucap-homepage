<!-- ============ COMING SOON card (Figma "02 Coming Soon" 2600:110 · tablet 2603:23 · mobile 2603:1408) ============
     White section, grey card: hourglass tile, red eyebrow (page name), title, text, two buttons.
     Change the eyebrow and the text per page. Comes right after .page-top (header + hero). -->
<section class="coming-soon-section">
  <div class="coming-soon" data-reveal-group>
    <div class="coming-soon__head" data-reveal="from-below" data-reveal-at="0.2" data-reveal-distance="30">
      <span class="coming-soon__icon"><img src="/assets/icons/hourglass.svg" alt="" width="48" height="48"></span>
      <p class="eyebrow">Brochures</p>
    </div>
    <div class="coming-soon__text">
      <h2 class="coming-soon__title" data-reveal="chars" data-reveal-at="0.35">Coming Soon!</h2>
      <p class="coming-soon__intro" data-reveal="from-below" data-reveal-at="0.55" data-reveal-distance="30">Our brochures and company presentation are being updated. In the meantime, contact us and we’ll send you the information you need.</p>
    </div>
    <div class="btn-row coming-soon__actions" data-reveal="from-below" data-reveal-at="0.7" data-reveal-distance="30">
      <a href="/contact/" class="btn btn--red btn--shadow-red">Contact Us</a>
      <a href="/" class="btn btn--outline">Back to Home</a>
    </div>
  </div>
</section>
