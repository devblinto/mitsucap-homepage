<!-- ============ COMPANY PRESENTATION (Figma "Resource Card" 2577:305) ============
     White section with a grey card: presentation mockup left, heading + dark button right.
     Stacks on tablet/mobile. The button links to /brochures/ until a presentation PDF exists.
     Colours alternate per Figma page: default white section + grey card; add "presentation--grey"
     for a grey section + white card (e.g. Tax-Exempt, Vendor Programs, Sale/Leaseback, PUT Lease desktop). -->
<section class="presentation">
  <div class="presentation__card" data-reveal-group>
    <div class="presentation__media" data-reveal="from-left" data-reveal-at="0.2" data-reveal-distance="40">
      <img src="/assets/images/shared/presentation.webp" alt="MitsuCap company presentation cover" width="1180" height="916" decoding="async" loading="lazy">
    </div>
    <div class="presentation__body">
      <h2 class="presentation__title" data-reveal="chars" data-reveal-at="0.3">We Finance The Equipment That Makes Your Business Run</h2>
      <a href="/brochures/" class="btn btn--dark btn--semibold" data-reveal="from-below" data-reveal-at="0.6" data-reveal-distance="30">View Presentation</a>
    </div>
  </div>
</section>
