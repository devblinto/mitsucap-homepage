<!-- ============ TESTIMONIAL (Figma "06 Equipment Expertise" 2577:313) ============
     Dark card on the grey background: red quote mark, quote, avatar + name + role.
     Change the quote/author only if the page's Figma frame shows a different one.
     Section background alternates per Figma page: default grey #F4F4F4; add "testimonial--white" for white. -->
<section class="testimonial">
  <figure class="testimonial__card" data-reveal-group>
    <blockquote class="testimonial__quote">
      <img class="testimonial__mark" src="/assets/icons/quote-mark.svg" alt="" width="46.72" height="30.464" data-reveal="from-below" data-reveal-at="0.2" data-reveal-distance="20">
      <p class="testimonial__text" data-reveal="from-below" data-reveal-at="0.35" data-reveal-distance="40">“The results were clear. The MitsuCap difference was their knowledge of my equipment as well as my industry”</p>
    </blockquote>
    <figcaption class="testimonial__author" data-reveal="from-below" data-reveal-at="0.6" data-reveal-distance="30">
      <img class="testimonial__avatar" src="/assets/images/shared/testimonial-rl.webp" alt="" width="120" height="120" loading="lazy">
      <span>
        <cite class="testimonial__name">R.L</cite>
        <span class="testimonial__role">President, US Sales for airport products</span>
      </span>
    </figcaption>
  </figure>
</section>
